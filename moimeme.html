<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se questionner sur moi-même - Le Labo des Curieux</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Lexend:wght@300..900&display=swap');

        :root {
            --bg-moi: #062f22;
            --text-light: #f1f5f9;
            --accent-green: #6ee7b7;
            --drawer-bg: #064e3b;
            --card-hover-bg: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Lexend', sans-serif;
            background-color: var(--bg-moi);
            color: var(--text-light);
            padding: 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header { text-align: center; padding: 40px 20px; }
        h1 { font-family: 'Fredoka', sans-serif; font-size: 3.5rem; color: var(--accent-green); margin-bottom: 20px; }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent-green);
            text-decoration: none;
            font-weight: bold;
            border: 1px solid var(--accent-green);
            padding: 10px 20px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .back-btn:hover { background: var(--accent-green); color: var(--bg-moi); }

        .grid-moi {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card-moi {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            overflow: hidden;
            transition: transform 0.3s, background-color 0.3s;
            cursor: pointer;
        }
        .card-moi:hover { transform: translateY(-5px); background: var(--card-hover-bg); }
        .card-moi img { width: 100%; height: 220px; object-fit: cover; filter: brightness(80%); transition: 0.5s; }
        .card-moi:hover img { filter: brightness(100%) scale(1.03); }
        .card-moi-content { padding: 25px; text-align: center; }
        .card-moi-content h2 { font-family: 'Fredoka', sans-serif; font-size: 1.8rem; margin-bottom: 10px; }
        .card-moi-content p { font-size: 1rem; color: #cbd5e1; line-height: 1.5; }

        /* --- PANNEAU COULISSANT (DRAWER) --- */
        .drawer {
            position: fixed;
            top: 0;
            right: -500px;
            width: 500px;
            max-width: 100%;
            height: 100vh;
            background-color: var(--drawer-bg);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.6);
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }
        .drawer.open { right: 0; }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .close-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-light);
            font-size: 1rem;
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 50px;
            font-family: 'Fredoka', sans-serif;
            transition: all 0.3s;
        }
        .close-btn:hover { background: var(--accent-green); color: var(--bg-moi); border-color: var(--accent-green); }

        .drawer-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.8rem;
            color: var(--accent-green);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        /* --- RECHERCHE ET TRI --- */
        .drawer-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-input {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 15px;
            border-radius: 12px;
            color: #fff;
            font-family: 'Lexend', sans-serif;
            font-size: 0.95rem;
        }
        .search-input:focus { outline: none; border-color: var(--accent-green); }
        .sort-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Lexend', sans-serif;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .sort-btn:hover { background: var(--accent-green); color: var(--bg-moi); }

        /* --- LISTE DES QUESTIONS --- */
        .questions-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
        }
        .question-item {
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            animation: slideInQuestion 0.4s ease forwards;
            opacity: 0;
            transform: translateX(20px);
        }
        @keyframes slideInQuestion { to { opacity: 1; transform: translateX(0); } }

        .question-text {
            font-size: 1.05rem;
            line-height: 1.5;
            margin-bottom: 8px;
        }
        .question-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .meta-tag {
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .meta-tag.date { border-color: rgba(110, 231, 183, 0.3); color: var(--accent-green); }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s; z-index: 999;
        }
        .overlay.visible { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>
    <a href="index.html" class="back-btn">⬅ Retour au Labo</a>

    <header>
        <h1>Se questionner sur moi-même 🧘‍♂️</h1>
        <p>Tourne ton regard vers l'intérieur pour explorer ton esprit, tes doutes et ton identité profonde.</p>
    </header>

    <main class="grid-moi">
        <div class="card-moi" data-topic="identite">
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=600&q=80" alt="Introspection">
            <div class="card-moi-content">
                <h2>L'identité</h2>
                <p>Qu'est-ce qui définit réellement qui tu es au-delà des apparences ?</p>
            </div>
        </div>
    </main>

    <!-- DRAWER -->
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <h2 class="drawer-title" id="drawer-title">Thème</h2>
            <button class="close-btn" id="close-btn">Fermer ✖</button>
        </div>
        
        <div class="drawer-controls">
            <input type="text" id="search" class="search-input" placeholder="Rechercher une question...">
            <button id="sort-btn" class="sort-btn" data-order="desc">Date ↓</button>
        </div>

        <ul class="questions-list" id="questions-list"></ul>
    </div>

    <script>
        const questionsData = {
            'identite': {
                title: "L'identité 🧘‍♂️",
                questions: [
                    {
                        text: "Es-tu la même personne qu'il y a dix ans, ou seulement une suite de souvenirs partagés ?",
                        pubDate: "2026-01-25",
                        creDate: "2025-10-15",
                        author: "John Locke",
                        theme: "Continuité de l'être"
                    },
                    {
                        text: "Qui es-tu lorsque tu te retrouves seul dans l'obscurité totale, sans miroir ni regard extérieur ?",
                        pubDate: "2026-05-30",
                        author: "Sartre",
                        theme: "Conscience de soi"
                    }
                ]
            }
        };

        let currentTopic = '';
        let currentOrder = 'desc';

        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('overlay');
        const closeBtn = document.getElementById('close-btn');
        const searchInput = document.getElementById('search');
        const sortBtn = document.getElementById('sort-btn');
        const questionsList = document.getElementById('questions-list');
        const drawerTitle = document.getElementById('drawer-title');

        function renderQuestions() {
            if (!currentTopic || !questionsData[currentTopic]) return;
            const data = questionsData[currentTopic];
            
            drawerTitle.textContent = data.title;
            questionsList.innerHTML = '';

            const term = searchInput.value.toLowerCase().trim();

            let filtered = data.questions.filter(q => {
                const textMatch = q.text.toLowerCase().includes(term);
                const authorMatch = q.author ? q.author.toLowerCase().includes(term) : false;
                const themeMatch = q.theme ? q.theme.toLowerCase().includes(term) : false;
                return textMatch || authorMatch || themeMatch;
            });

            filtered.sort((a, b) => {
                const dateA = new Date(a.pubDate);
                const dateB = new Date(b.pubDate);
                return currentOrder === 'asc' ? dateA - dateB : dateB - dateA;
            });

            filtered.forEach((q, index) => {
                const li = document.createElement('li');
                li.className = 'question-item';
                li.style.animationDelay = `${index * 0.04}s`;

                let metaHTML = `<span class="meta-tag date">📅 Publié : ${q.pubDate}</span>`;
                if (q.creDate) metaHTML += `<span class="meta-tag">✍️ Créé : ${q.creDate}</span>`;
                if (q.author) metaHTML += `<span class="meta-tag">👤 Source : ${q.author}</span>`;
                if (q.theme) metaHTML += `<span class="meta-tag">🏷️ Thème : ${q.theme}</span>`;

                li.innerHTML = `
                    <div class="question-text">${q.text}</div>
                    <div class="question-meta">${metaHTML}</div>
                `;
                questionsList.appendChild(li);
            });
        }

        function openDrawer(topicKey) {
            currentTopic = topicKey;
            searchInput.value = '';
            drawer.classList.add('open');
            overlay.classList.add('visible');
            renderQuestions();
        }

        function closeDrawer() {
            drawer.classList.remove('open');
            overlay.classList.remove('visible');
        }

        document.querySelectorAll('.card-moi').forEach(card => {
            card.addEventListener('click', () => openDrawer(card.getAttribute('data-topic')));
        });

        closeBtn.addEventListener('click', closeDrawer);
        overlay.addEventListener('click', closeDrawer);
        searchInput.addEventListener('input', renderQuestions);

        sortBtn.addEventListener('click', () => {
            currentOrder = currentOrder === 'desc' ? 'asc' : 'desc';
            sortBtn.textContent = currentOrder === 'desc' ? 'Date ↓' : 'Date ↑';
            renderQuestions();
        });

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
    </script>
</body>
</html>
