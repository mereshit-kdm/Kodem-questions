<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Labo des Curieux</title>
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>

    <div id="app-container"></div>

    <div id="drawer-overlay" class="drawer-overlay"></div>
    <div id="search-drawer" class="drawer">
        <div class="drawer-header">
            <h3 id="drawer-title">Résultats</h3>
            <button id="close-drawer" class="drawer-close-btn">&times;</button>
        </div>
        <div class="search-container" style="padding: 10px;">
            <input type="text" id="drawer-search-input" class="search-input" placeholder="🔍 Rechercher...">
        </div>
        <div id="drawer-content" class="drawer-results"></div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase-client.js';
        import { fetchAllCategories } from './js/app.js';

        const appContainer = document.getElementById('app-container');
        const drawer = document.getElementById('search-drawer');
        const overlay = document.getElementById('drawer-overlay');
        const drawerContent = document.getElementById('drawer-content');
        const drawerTitle = document.getElementById('drawer-title');
        const drawerSearchInput = document.getElementById('drawer-search-input');

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const categoryId = urlParams.get('id');
            categoryId ? renderCategoryPage(categoryId) : renderHomePage();
            initDrawerSearch();
        });

        async function renderHomePage() {
            const categories = await fetchAllCategories();
            
            const categoryData = {
                "Se questionner sur soi-même": { color: "#00ffaa", desc: "Plongez à l’intérieur de votre être : l’identité, les mystères de votre conscience et le secret de votre âme." },
                "Se questionner sur le monde": { color: "#ff9933", desc: "Explorez l’histoire terrestre : les révolutions majeures, les secrets des civilisations et les énigmes géographiques." },
                "Se questionner sur l’avenir": { color: "#33ccff", desc: "Interrogez demain et l’inconnu : le rôle du hasard, le mystère des prophéties et la force du destin." },
                "Se questionner sur l’autre": { color: "#ff3366", desc: "Explorez les mystères de l’empathie, la complexité du vivre-ensemble et les secrets des liens humains." },
                "Se questionner sur l’au-delà": { color: "#b894ff", desc: "Voyagez aux limites de notre réalité : au-delà de la mort, du temps, de l’espace et de l’univers." },
                "Se questionner sur l’invisible": { color: "#94a6ff", desc: "Explorez ce que nos yeux ne perçoivent pas : de l’infiniment petit aux forces sacrées ou secrètes." },
                "Se questionner sur les croyances": { color: "#ffb347", desc: "Explorez l’histoire de la foi et des convictions humaines : le monothéisme, l’athéisme et les mythologies." }
            };

            appContainer.innerHTML = `
                <header style="text-align: center; padding: 20px;">
                    <h1>Le Labo des <span>Curieux</span> 🧪</h1>
                    <p>Bienvenue dans cet espace d'exploration philosophique. Choisis une grande catégorie pour ouvrir les portes des mystères de l’univers, de la pensée humaine, des croyances et du temps.</p>
                    <div class="search-container" style="margin: 20px auto; max-width: 500px;">
                        <input type="text" id="home-search-input" class="search-input" placeholder="🔍 Rechercher une question, une sous-catégorie...">
                    </div>
                </header>
                <main class="grid-categories" id="categories-container"></main>
            `;

            document.getElementById('categories-container').innerHTML = categories.map(cat => {
                const data = categoryData[cat.title] || { color: "#ffffff", desc: cat.description || "" };
                return `
                    <a href="?id=${cat.id}" class="category-card" style="border: 2px solid ${data.color}">
                        <div class="card-image-wrapper"><img src="${cat.image_url}" alt="${cat.title}"></div>
                        <div class="card-body">
                            <h2 style="color: ${data.color}">${cat.title}</h2>
                            <p style="color: #ccc;">${data.desc}</p>
                        </div>
                    </a>
                `;
            }).join('');

            let searchTimeout;
            document.getElementById('home-search-input').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                const term = e.target.value;
                if (term.length < 2) return;
                searchTimeout = setTimeout(() => {
                    drawerTitle.textContent = "Résultats de recherche";
                    drawer.classList.add('open');
                    overlay.classList.add('active');
                    drawerSearchInput.value = term;
                    drawerSearchInput.dispatchEvent(new Event('input'));
                }, 800);
            });
        }

        function initDrawerSearch() {
            drawerSearchInput.addEventListener('input', async (e) => {
                const term = e.target.value;
                if (term.length < 2) {
                    drawerContent.innerHTML = "";
                    return;
                }
                const words = term.trim().split(' ');
                let query = supabase.from('questions').select('*');
                words.forEach(word => { query = query.ilike('title', `%${word}%`); });
                const { data } = await query;
                drawerContent.innerHTML = (data || []).map(q => `<h4 class="question-item">${q.title}</h4>`).join('');
            });
        }

        async function renderCategoryPage(id) {
            appContainer.innerHTML = `
                <nav style="padding: 20px;"><a href="./" class="q-badge badge-cat">← Retour</a></nav>
                <header style="text-align:center;">
                    <h1 id="main-title">Chargement...</h1>
                    <p id="main-description"></p>
                </header>
                <main class="grid-categories" id="subcategories-grid"></main>
            `;
            
            const { data: category } = await supabase.from('categories').select('*').eq('id', id).single();
            const { data: subcategories } = await supabase.from('subcategories').select('*').eq('category_id', id);

            document.getElementById('main-title').textContent = category.title;
            document.getElementById('main-description').textContent = category.description || "";

            const grid = document.getElementById('subcategories-grid');
            grid.innerHTML = subcategories.map(sub => `
                <div class="category-card" data-sub-id="${sub.id}" style="cursor: pointer;">
                    <div class="card-image-wrapper"><img src="${sub.image_url}"></div>
                    <div class="card-body">
                        <h2>${sub.name}</h2>
                        <p>${sub.description || 'Explorer ce thème...'}</p>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.category-card').forEach(card => {
                card.addEventListener('click', () => openDrawer(card.getAttribute('data-sub-id')));
            });
        }

        async function openDrawer(subId) {
            drawer.classList.add('open');
            overlay.classList.add('active');
            const { data } = await supabase.from('questions').select('*').eq('subcategory_id', subId);
            drawerContent.innerHTML = (data || []).map(q => `<h4 class="question-item">${q.title}</h4>`).join('');
        }

        function closeDrawer() {
            drawer.classList.remove('open');
            overlay.classList.remove('active');
        }

        document.getElementById('close-drawer').addEventListener('click', closeDrawer);
        overlay.addEventListener('click', closeDrawer);
    </script>
</body>
</html>
