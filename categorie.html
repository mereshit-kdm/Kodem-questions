<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Labo des Curieux - Exploration</title>
    <link rel="stylesheet" href="/css/main.css">
</head>

<body>
    <nav style="padding: 20px;">
        <a href="index.html" class="q-badge badge-cat" style="text-decoration: none;">← Retour au Labo</a>
    </nav>

    <header>
        <h1 id="main-title">Chargement...</h1>
        <p id="main-description">Connexion au labo philosophique en cours...</p>
    </header>

    <main class="grid-categories" id="subcategories-grid">
        <p class="loading-text">Chargement des sous-catégories...</p>
    </main>

    <div id="overlay" class="drawer-overlay"></div>
    <div id="drawer" class="drawer">
        <div class="drawer-header">
            <h3 id="drawer-title">Thème</h3>
            <button id="close-btn" class="drawer-close-btn">&times;</button>
        </div>

        <div class="search-container" style="padding: 10px 20px; margin: 0;">
            <input type="text" id="search" class="search-input" placeholder="🔍 Rechercher une question...">
            <button id="sort-btn" class="q-badge badge-cat"
                style="margin-top: 10px; cursor: pointer; border: none;">Date ↓</button>
        </div>

        <div id="questions-list" class="drawer-results" style="padding-top: 10px;"></div>
    </div>

    <footer>
        <p>© 2026 Le Labo des Curieux — Développé sur la branche developer-v2</p>
    </footer>

    <script type="module">
        import { supabase } from './js/supabase-client.js';

        const urlParams = new URLSearchParams(window.location.search);
        const categoryId = parseInt(urlParams.get('id'), 10);

        let categoryData = null;
        let currentOrder = 'desc';
        let activeQuestions = [];

        const grid = document.getElementById('subcategories-grid');
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('overlay');
        const closeBtn = document.getElementById('close-btn');
        const searchInput = document.getElementById('search');
        const sortBtn = document.getElementById('sort-btn');
        const questionsList = document.getElementById('questions-list');
        const drawerTitle = document.getElementById('drawer-title');
        const mainTitle = document.getElementById('main-title');
        const mainDescription = document.getElementById('main-description');

        if (!categoryId) {
            grid.innerHTML = `<p class="loading-text" style="color: #f87171;">Erreur : Aucune catégorie spécifiée.</p>`;
        } else {
            loadContent();
        }

        async function loadContent() {
            try {
                const { data: category, error: catError } = await supabase
                    .from('categories')
                    .select('*')
                    .eq('id', categoryId)
                    .single();

                if (catError || !category) return;

                const { data: subcategories, error: subError } = await supabase
                    .from('subcategories')
                    .select('id, name, description, image_url')
                    .eq('category_id', categoryId);

                if (subError) throw subError;

                categoryData = { ...category, subcategories: subcategories || [] };
                document.title = `Le Labo des Curieux - ${category.title}`;
                mainTitle.innerHTML = `${category.title} <span>✨</span>`;
                mainDescription.textContent = category.description || "";
                renderSubcategories();
            } catch (error) {
                console.error("Erreur:", error);
            }
        }

        function renderSubcategories() {
            grid.innerHTML = categoryData.subcategories.map(sub => `
                <div class="category-card" data-sub-id="${sub.id}" style="cursor: pointer;">
                    <div class="card-image-wrapper">
                        <img src="${sub.image_url || 'https://images.unsplash.com/photo-1516339901601-2e1b62dc0c45?q=80&w=600'}" alt="${sub.name}">
                    </div>
                    <div class="card-body">
                        <h2>${sub.name}</h2>
                        <p>${sub.description || 'Plongez dans les mystères de ce thème.'}</p>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.category-card').forEach(card => {
                card.addEventListener('click', () => openDrawer(card.getAttribute('data-sub-id')));
            });
        }

        async function openDrawer(subId) {
            const cleanSubId = parseInt(subId, 10);

            // DEBUG : Vérifions si l'ID est bien reçu
            console.log("Tentative d'ouverture pour l'ID:", cleanSubId);

            if (isNaN(cleanSubId)) {
                console.error("ID invalide reçu:", subId);
                return;
            }

            const sub = categoryData.subcategories.find(s => s.id === cleanSubId);
            drawerTitle.textContent = sub ? sub.name : "Thème";

            drawer.classList.add('open');
            overlay.classList.add('active');
            questionsList.innerHTML = `<p class="loading-text">Recherche pour ID: ${cleanSubId}...</p>`;


            try {

                const { data, error } = await supabase
                    .from('questions')
                    .select('*')
                    .eq('subcategory_id', Number(cleanSubId)) // Forcer explicitement en nombre
                    .order('id', { ascending: true });


                if (error) throw error;

                // AJOUTEZ CETTE LIGNE DE DÉBOGAGE
                console.log("Données reçues de Supabase pour l'ID", cleanSubId, ":", data);

                activeQuestions = data || [];
                renderDrawerQuestions();

            } catch (err) {
                console.error("Erreur attrapée:", err);
                questionsList.innerHTML = `<p>Erreur: ${err.message}</p>`;
            }

        }


        function renderDrawerQuestions() {
            const term = searchInput.value.toLowerCase().trim();
            let filtered = activeQuestions.filter(q => (q.title?.toLowerCase().includes(term) || q.content?.toLowerCase().includes(term)));

            filtered.sort((a, b) => {
                const dateA = new Date(a.publication_date || 0);
                const dateB = new Date(b.publication_date || 0);
                return currentOrder === 'asc' ? dateA - dateB : dateB - dateA;
            });

            questionsList.innerHTML = filtered.length === 0 ? `<p class="loading-text">Aucune question ici.</p>` : '';
            filtered.forEach(q => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = `<h4>${q.title}</h4><p>${q.content || ''}</p>`;
                questionsList.appendChild(card);
            });
        }

        closeBtn.addEventListener('click', () => { drawer.classList.remove('open'); overlay.classList.remove('active'); });
        searchInput.addEventListener('input', renderDrawerQuestions);
        sortBtn.addEventListener('click', () => {
            currentOrder = currentOrder === 'desc' ? 'asc' : 'desc';
            sortBtn.textContent = currentOrder === 'desc' ? 'Date ↓' : 'Date ↑';
            renderDrawerQuestions();
        });
    </script>
</body>

</html>
